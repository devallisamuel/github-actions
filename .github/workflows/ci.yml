name: First deployment
on: push
jobs: 
  lint:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout your branch
        uses: actions/checkout@v4
      - name: Cache local npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: deps-node-module-${{ hashFiles('**/package-lock.json') }}
      - name: Then install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Then install dependencies
        run: npm ci
        
      - name: Run the npm lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps: 
      - name: Checkout your branch
        uses: actions/checkout@v4
      - name: Cache local npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: deps-node-module-${{ hashFiles('**/package-lock.json') }}

      - name: Then install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Then install dependencies
        run: npm ci

      - name: Run the test
        run: npm run test

      - name: Print Node 22 diagnostics
        if: matrix.node-version == '22.x'
        run: node --version
  build:
    runs-on: ubuntu-latest
    outputs: 
      build_version: ${{ steps.metadata.outputs.version }}
    steps: 
      - name: Checkout your branch
        uses: actions/checkout@v4

      - name: Then install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Cache local npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: deps-node-module-${{ hashFiles('**/package-lock.json') }}
          
      - name: Then install dependencies
        run: npm ci

      - name: build the application 
        run: npm run build
      - name: test output
        id: metadata
        run: echo "version=1.0.0" >> "$GITHUB_OUTPUT"
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: nest-build
          path: dist/
          if-no-files-found: error
          continue-on-error: true
          retention-days: 7
  download-build:
    env:
      DUMMY_SECRET: DUMMY_SECRET
    needs: build
    if: needs.build.outputs.build_version == '1.0.0'
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: nest-build
          path: dist/

      - name: Verify downloaded build
        run: test -f dist/main.js
      - name: Print secret
        run: echo $DUMMY_SECRET
      - name: Use build output
        run: |
          echo "Build version is ${{ needs.build.outputs.build_version }}"

  reusable:
      runs-on: ubuntu-latest
      needs: download-build
      uses: ./.github/workflows/reusable.yml
